name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Match tag and package versions
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "protium-tui") | .version')"
          test -n "$package_version"
          test "$tag_version" = "$package_version"

  verify-linux:
    name: Verify (Linux)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Test
        run: cargo test --all-features --locked
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Formatting
        run: cargo fmt --all -- --check

  verify-platforms:
    name: Verify (${{ matrix.check-name }})
    needs: version
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check-name: macos-latest
            runner: macos-26
          - check-name: windows-latest
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Test
        run: cargo test --all-features --locked

  build:
    name: Build (${{ matrix.target }})
    needs: [version, verify-linux, verify-platforms]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            slug: linux-x86_64
            binary: 1h-agent
            archive: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            slug: windows-x86_64
            binary: 1h-agent.exe
            archive: zip
          - runner: macos-26-intel
            target: x86_64-apple-darwin
            slug: macos-x86_64
            binary: 1h-agent
            archive: tar.gz
          - runner: macos-26
            target: aarch64-apple-darwin
            slug: macos-aarch64
            binary: 1h-agent
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Build optimized binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="1h-agent-${GITHUB_REF_NAME}-${{ matrix.slug }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${package}/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md config/config.example.toml "dist/${package}/"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "1h-agent-${{ github.ref_name }}-${{ matrix.slug }}"
          New-Item -ItemType Directory -Path "dist/$package" -Force
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$package/"
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md, config/config.example.toml "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"

      - name: Package macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          package="1h-agent-${GITHUB_REF_NAME}-${{ matrix.slug }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${package}/"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md config/config.example.toml "dist/${package}/"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"

      - name: Upload release archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 1h-agent-${{ github.ref_name }}-${{ matrix.slug }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  installers:
    name: Installer (${{ matrix.check-name }})
    needs: [version, verify-linux, verify-platforms]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            check-name: ubuntu-latest
            slug: linux-deb
            path: target/debian/*.deb
          - runner: windows-2025
            check-name: windows-latest
            slug: windows-msi
            path: target/wix/*.msi
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Build deb
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb
      - name: Build msi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install cargo-wix --locked
          cargo wix init
          cargo wix --nocapture
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 1h-agent-${{ github.ref_name }}-${{ matrix.slug }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build, installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Add third-party notices to release assets
        run: cp THIRD_PARTY_NOTICES.md release-artifacts/THIRD_PARTY_NOTICES.md
      - name: Generate checksums
        working-directory: release-artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-artifacts/* \
            --verify-tag \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --title "1H-Agent ${GITHUB_REF_NAME}"
